function showModal(title, content){

    modal.classList.add("active");

}


function closeInfoModal(){

    modal.classList.remove("active");

}


closeModal.addEventListener(
    "click",

);


modal.addEventListener(
    "click",
    function(e){

        if(e.target === modal){

    }
);


document.addEventListener(

// Ensure .buttons has an explicit height that matches the hero image so percentage-based hotspot sizes work
(function(){
  const heroImage = document.querySelector('.hero-image');
  const buttons = document.querySelector('.buttons');

  function setButtonsHeight(){
    if(heroImage && buttons){
      buttons.style.height = heroImage.getBoundingClientRect().height + 'px';
    }
  }

  if(heroImage){
    if(heroImage.complete){
      setButtonsHeight();
    } else {
      heroImage.addEventListener('load', setButtonsHeight);
    }
    window.addEventListener('resize', setButtonsHeight);
  }
})();
