 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S&K Specialist Graffiti Response | North Wales, Cheshire & North West</title>

<meta name="description" content="S&K Specialist Graffiti Response Ltd. Professional graffiti removal, restoration and anti-graffiti protection across North Wales, Cheshire and the North West. 24/7 emergency response.">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    background:#050608;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:#050608;
}

.hero-image{
    width:100%;
    display:block;
    height:auto;
}

.buttons{
    position:relative;
    width:100%;
    max-width:1536px;
    margin:0 auto;
}

.hotspot{
    position:absolute;
    display:block;
    text-decoration:none;
    cursor:pointer;
}

/* Main Request a Quote button */
.quote{
    left:3.2%;
    top:27.3%;
    width:18.5%;
    height:3.2%;
}

/* Send a Photo button */
.photo{
    left:22.8%;
    top:27.3%;
    width:18%;
    height:3.2%;
}

/* WhatsApp button */
.whatsapp{
    left:3.5%;
    top:78.1%;
    width:18%;
    height:3.1%;
}

/* Bottom Send Photo */
.bottom-photo{
    left:23.5%;
    top:78.1%;
    width:18%;
    height:3.1%;
}

/* Bottom quote */
.bottom-quote{
    left:42.5%;
    top:78.1%;
    width:18%;
    height:3.1%;
}

/* Header quote */
.header-quote{
    right:2.5%;
    top:3%;
    width:16.5%;
    height:4%;
}

/* Phone */
.phone{
    right:2%;
    top:0;
    width:15%;
    height:5%;
}

@media(max-width:700px){

    .hero-image{
        width:100%;
        height:auto;
    }

    .quote{
        left:3%;
        top:27%;
        width:19%;
        height:3%;
    }

    .photo{
        left:23%;
        top:27%;
        width:18%;
        height:3%;
    }

    .whatsapp{
        left:3%;
        top:78%;
        width:18%;
        height:3%;
    }

    .bottom-photo{
        left:23%;
        top:78%;
        width:18%;
        height:3%;
    }

    .bottom-quote{
        left:42%;
        top:78%;
        width:19%;
        height:3%;
    }

}

</style>
</head>

<body>

<div class="page">

    <!--
    IMPORTANT:
    Upload the approved landing-page.webp image
    into the same GitHub repository as this index.html file.
    -->

    <div class="buttons">

        <img
            src="landing-page.webp"
            alt="S&K Specialist Graffiti Response - Professional graffiti removal and prevention"
            class="hero-image"
        >

        <!-- Header quote -->
        <a
            class="hotspot header-quote"
            href="#contact"
            aria-label="Request a quote">
        </a>

        <!-- Emergency phone -->
        <a
            class="hotspot phone"
            href="tel:07488296220"
            aria-label="Call S&K Specialist Graffiti Response">
        </a>

        <!-- Main quote -->
        <a
            class="hotspot quote"
            href="#contact"
            aria-label="Request a quote">
        </a>

        <!-- Main send photo -->
        <a
            class="hotspot photo"
            href="mailto:info@skspecialistgraffitiresponse.co.uk?subject=Graffiti Removal Enquiry"
            aria-label="Send a photo">
        </a>

        <!-- WhatsApp -->
        <a
            class="hotspot whatsapp"
            href="https://wa.me/447488296220?text=Hi%20S%26K%20Specialist%20Graffiti%20Response%2C%20I%20would%20like%20a%20graffiti%20removal%20quote."
            aria-label="Contact S&K on WhatsApp">
        </a>

        <!-- Bottom send photo -->
        <a
            class="hotspot bottom-photo"
            href="mailto:info@skspecialistgraffitiresponse.co.uk?subject=Graffiti Removal Photo"
            aria-label="Send a photo">
        </a>

        <!-- Bottom quote -->
        <a
            class="hotspot bottom-quote"
            href="#contact"
            aria-label="Request a quote">
        </a>

    </div>

</div>

<!-- Contact anchor -->
<div id="contact"></div>

<script>

document.querySelectorAll('a[href="#contact"]').forEach(function(button){

    button.addEventListener('click', function(e){

        e.preventDefault();

        window.location.href =
        'mailto:info@skspecialistgraffitiresponse.co.uk?subject=Graffiti Removal Quote Request';

    });

});

</script>

</body>
</html>
